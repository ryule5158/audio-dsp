# 100ASK i.MX6ULL Pro / WM8960 low-latency starting profile.
# Confirm the card ID with: aplay -l; arecord -l
[audio]
capture_device=hw:CARD=wm8960audio,DEV=0
playback_device=hw:CARD=wm8960audio,DEV=0
sample_rate=48000
period_frames=256
periods=4
format=s16
max_delay_ms=1000
require_duplex_link=true

[realtime]
priority=60
lock_memory=true
allow_fallback=false

[effects]
input_gain=1.0
filter_cutoff_hz=15000
filter_resonance=0.05
filter_mix=0.0
drive=0.0
delay_ms=250
delay_feedback=0.25
delay_crossfeed=0.0
delay_mix=0.0
output_gain=0.8
